title = "support-desk-assistant"

[extend]
useDefault = true

# Eval result rows carry sha256 cache keys (answer_cache_key, judge_cache_key) that the
# generic-api-key rule mistakes for secrets. Narrow on purpose: only these two field names.
[[allowlists]]
description = "eval result cache keys are content hashes, not credentials"
regexTarget = "line"
regexes = ['''"(answer|judge)_cache_key": "[0-9a-f]{64}"''']
paths = ['''data/eval/results/.*\.jsonl$''']
condition = "AND"

# The fake API key that tests send in X-API-Key (decision 31). Narrow on purpose: one file, one
# exact line, so a real key pasted anywhere else is still caught.
[[allowlists]]
description = "fake test API key for the auth tests"
regexTarget = "line"
regexes = ['''API_KEY = "test-api-key-0123456789abcdef"''']
paths = ['''tests/fakes\.py$''']
condition = "AND"
