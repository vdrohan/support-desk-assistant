services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # The HTTP API (docs/decisions.md #31). Reached from your own machine through an SSH tunnel to
  # 127.0.0.1:8000, like Qdrant. Needs .env on this host with ANTHROPIC_API_KEY, VOYAGE_API_KEY
  # and SDA_API_KEY; without SDA_API_KEY it refuses to start.
  api:
    build: .
    image: support-desk-assistant-api:0.1.0
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false # so `docker compose up -d qdrant` works before .env exists
    environment:
      QDRANT_URL: http://qdrant:6333
      # Inside the container the server must listen on every interface for the published port
      # to reach it; the port above is published on the host's loopback only.
      SDA_API__HOST: 0.0.0.0
      SDA_TRIAGE__DB_FILE: db/tickets.sqlite
    volumes:
      - api_db:/app/data/db # tickets: back this one up
      - api_cache:/app/data/cache # response caches; safe to delete
      - api_logs:/app/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  qdrant_data:
  api_db:
  api_cache:
  api_logs:
