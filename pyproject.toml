[project]
name = "support-desk-assistant"
version = "0.1.0"
description = "RAG Q&A and ticket triage assistant for support desks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vdrohan" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.12.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.156.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "protego>=0.7.0",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "uvicorn>=0.54.0",
    "voyageai>=0.5.0",
]

[project.scripts]
sda = "support_desk_assistant.answer.cli:main"
sda-ingest = "support_desk_assistant.ingest.__main__:main"
sda-search = "support_desk_assistant.retrieve:main"
sda-eval-retrieval = "support_desk_assistant.evals.retrieval:main"
sda-eval-draft = "support_desk_assistant.evals.draft_questions:main"
sda-eval-review = "support_desk_assistant.evals.review:main"
sda-eval-answers = "support_desk_assistant.evals.answers:main"
sda-api = "support_desk_assistant.api.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = [
  # qdrant-client ":memory:" mode ignores payload indexes; the server honours them
  "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff==0.16.10",
]
