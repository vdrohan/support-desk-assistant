# Install once: uv run pre-commit install (installs the pre-commit and the commit-msg hook)
# Keep the ruff rev in sync with the ruff pin in pyproject.toml.
default_install_hook_types: [pre-commit, commit-msg]
# Without this, the file hooks below would also run at the commit-msg stage, on the message.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Commit subject style (CLAUDE.md "Commits", docs/decisions.md #32). A local script: no extra
  # dependency to pin.
  - repo: local
    hooks:
      - id: commit-message-style
        name: commit message style
        entry: uv run python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
