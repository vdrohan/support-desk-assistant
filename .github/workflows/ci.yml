name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # Pull requests are squash-merged, so the title becomes the commit subject (decisions.md #32).
  # Dependabot titles can be longer than the limit, so its pull requests are skipped.
  pr-title:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_commit_msg.py --subject "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  # Builds the API image and checks the parts that only exist inside it (decisions.md #31).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t sda-api:ci .
      - name: Without a key the container must not start
        run: |
          if docker run --rm sda-api:ci; then
            echo "the API started without SDA_API_KEY" >&2
            exit 1
          fi
      - name: With a key it starts, health is open, /ask is not, and it is not root
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 \
            -e SDA_API__HOST=0.0.0.0 -e SDA_API_KEY=ci-only-throwaway-key-0123456789 sda-api:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/ask \
            -H 'content-type: application/json' -d '{"question": "q"}')
          test "$code" = 401
          test "$(docker exec api id -u)" != 0
          docker exec api test -f prompts/answer_system.md
          docker exec api test -f data/manifest.jsonl
      - if: failure()
        run: docker logs api || true
